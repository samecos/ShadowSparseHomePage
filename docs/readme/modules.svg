<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-label="六盏荷花灯顺着小河漂:01 日常说说、02 照片、03 地图故事、04 工作展示、05 有趣的搜集、06 旅行">
  <style>
    .wave { stroke: #658092; fill: none; stroke-linecap: round; animation: drift 9s ease-in-out infinite alternate; }
    .w1 { opacity: 0.35; }
    .w2 { opacity: 0.18; animation-duration: 12s; animation-delay: -4s; }
    .bob { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 4.6s ease-in-out infinite; }
    .rock { transform-box: fill-box; transform-origin: 50% 100%; animation: rock 3.4s ease-in-out infinite; }
    .flap { transform-box: fill-box; transform-origin: center; animation: flap 1.1s ease-in-out infinite; }
    .num {
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", "Noto Serif CJK SC", serif;
      font-size: 15px;
      fill: #4A525C;
      letter-spacing: 0.12em;
    }
    @keyframes drift {
      from { transform: translateX(-10px); }
      to { transform: translateX(10px); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }
    @keyframes rock {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      30% { transform: rotate(-4deg) translateY(-1px); }
      70% { transform: rotate(3.5deg) translateY(0.5px); }
    }
    @keyframes flap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wave, .bob, .rock, .flap { animation: none; }
    }
  </style>

  <!-- 远山一样的淡影 -->
  <path d="M 0 168 Q 240 150 480 166 T 960 162" stroke="#EDF0F2" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- 小舟 -->
  <g transform="translate(66, 158)">
    <g class="rock">
      <path d="M -16 0 C -8 2.5 8 2.5 16 0 C 12 6.5 -12 6.5 -16 0 Z" fill="#fbfcfc" stroke="#4a525c" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M -5 -1 L -2 -10 L 3 -1 Z" fill="#d9a8b4" opacity="0.85"/>
    </g>
  </g>

  <!-- 六盏荷花灯 -->
  <g transform="translate(150, 108)">
    <g class="bob" style="animation-delay: 0s">
      <ellipse cx="0" cy="34" rx="16" ry="3" fill="#658092" opacity="0.12"/>
      <path d="M 0 26 C -5 14 -3.5 4 0.5 0 C 4.5 4 6 14 2 26 Z" fill="#dcaeae"/>
      <path d="M 0 26 C -6.5 23 -9.5 16 -8 10 C -3.5 13 -1 19 0 26 Z" fill="#d9a8b4"/>
      <path d="M 2 26 C 8.5 23 11.5 16 10 10 C 5.5 13 3 19 2 26 Z" fill="#d9a8b4"/>
      <text class="num" x="0" y="62" text-anchor="middle">01</text>
    </g>
  </g>
  <g transform="translate(300, 116)">
    <g class="bob" style="animation-delay: -1.4s">
      <ellipse cx="0" cy="34" rx="16" ry="3" fill="#658092" opacity="0.12"/>
      <path d="M 0 26 C -5 14 -3.5 4 0.5 0 C 4.5 4 6 14 2 26 Z" fill="#dcaeae"/>
      <path d="M 0 26 C -6.5 23 -9.5 16 -8 10 C -3.5 13 -1 19 0 26 Z" fill="#d9a8b4"/>
      <path d="M 2 26 C 8.5 23 11.5 16 10 10 C 5.5 13 3 19 2 26 Z" fill="#d9a8b4"/>
      <text class="num" x="0" y="62" text-anchor="middle">02</text>
    </g>
  </g>
  <g transform="translate(450, 104)">
    <g class="bob" style="animation-delay: -2.6s">
      <ellipse cx="0" cy="34" rx="16" ry="3" fill="#658092" opacity="0.12"/>
      <path d="M 0 26 C -5 14 -3.5 4 0.5 0 C 4.5 4 6 14 2 26 Z" fill="#dcaeae"/>
      <path d="M 0 26 C -6.5 23 -9.5 16 -8 10 C -3.5 13 -1 19 0 26 Z" fill="#d9a8b4"/>
      <path d="M 2 26 C 8.5 23 11.5 16 10 10 C 5.5 13 3 19 2 26 Z" fill="#d9a8b4"/>
      <text class="num" x="0" y="62" text-anchor="middle">03</text>
    </g>
  </g>
  <g transform="translate(600, 114)">
    <g class="bob" style="animation-delay: -0.8s">
      <ellipse cx="0" cy="34" rx="16" ry="3" fill="#658092" opacity="0.12"/>
      <path d="M 0 26 C -5 14 -3.5 4 0.5 0 C 4.5 4 6 14 2 26 Z" fill="#dcaeae"/>
      <path d="M 0 26 C -6.5 23 -9.5 16 -8 10 C -3.5 13 -1 19 0 26 Z" fill="#d9a8b4"/>
      <path d="M 2 26 C 8.5 23 11.5 16 10 10 C 5.5 13 3 19 2 26 Z" fill="#d9a8b4"/>
      <text class="num" x="0" y="62" text-anchor="middle">04</text>
    </g>
  </g>
  <g transform="translate(750, 106)">
    <g class="bob" style="animation-delay: -2s">
      <ellipse cx="0" cy="34" rx="16" ry="3" fill="#658092" opacity="0.12"/>
      <path d="M 0 26 C -5 14 -3.5 4 0.5 0 C 4.5 4 6 14 2 26 Z" fill="#dcaeae"/>
      <path d="M 0 26 C -6.5 23 -9.5 16 -8 10 C -3.5 13 -1 19 0 26 Z" fill="#d9a8b4"/>
      <path d="M 2 26 C 8.5 23 11.5 16 10 10 C 5.5 13 3 19 2 26 Z" fill="#d9a8b4"/>
      <text class="num" x="0" y="62" text-anchor="middle">05</text>
    </g>
  </g>
  <g transform="translate(890, 112)">
    <g class="bob" style="animation-delay: -3.3s">
      <ellipse cx="0" cy="34" rx="16" ry="3" fill="#658092" opacity="0.12"/>
      <path d="M 0 26 C -5 14 -3.5 4 0.5 0 C 4.5 4 6 14 2 26 Z" fill="#dcaeae"/>
      <path d="M 0 26 C -6.5 23 -9.5 16 -8 10 C -3.5 13 -1 19 0 26 Z" fill="#d9a8b4"/>
      <path d="M 2 26 C 8.5 23 11.5 16 10 10 C 5.5 13 3 19 2 26 Z" fill="#d9a8b4"/>
      <text class="num" x="0" y="62" text-anchor="middle">06</text>
    </g>
  </g>

  <!-- 水波 -->
  <path class="wave w1" d="M 0 168 Q 40 162 80 168 T 160 168 T 240 168 T 320 168 T 400 168 T 480 168 T 560 168 T 640 168 T 720 168 T 800 168 T 880 168 T 960 168"/>
  <path class="wave w2" d="M 0 188 Q 40 183 80 188 T 160 188 T 240 188 T 320 188 T 400 188 T 480 188 T 560 188 T 640 188 T 720 188 T 800 188 T 880 188 T 960 188"/>

  <!-- 鸥鹭 -->
  <g transform="translate(838, 44)">
    <path class="flap" d="M 0 0 Q 6 -6 12 0 Q 6 -3 0 0 Z" fill="#4a525c" opacity="0.55"/>
  </g>
  <g transform="translate(874, 58)">
    <path class="flap" style="animation-delay: -0.5s" d="M 0 0 Q 5 -5 10 0 Q 5 -2.5 0 0 Z" fill="#4a525c" opacity="0.4"/>
  </g>
</svg>
