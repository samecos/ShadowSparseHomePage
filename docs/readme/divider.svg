<svg xmlns="http://www.w3.org/2000/svg" width="480" height="56" viewBox="0 0 480 56" role="img" aria-label="小舟 · 藕花 · 鸥鹭">
  <style>
    .line { stroke: rgba(25, 29, 34, 0.18); stroke-width: 1; }
    .wave { stroke: rgba(101, 128, 146, 0.4); stroke-width: 1; fill: none; animation: drift 7s ease-in-out infinite alternate; transform-box: fill-box; }
    .boat { transform-box: fill-box; transform-origin: 50% 100%; animation: rock 3.4s ease-in-out infinite; }
    .bird { transform-box: fill-box; transform-origin: center; animation: flap 1.1s ease-in-out infinite; }
    .bud { animation: breathe 6s ease-in-out infinite; }
    @keyframes rock {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      30% { transform: rotate(-4deg) translateY(-1px); }
      70% { transform: rotate(3.5deg) translateY(0.5px); }
    }
    @keyframes flap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.4); }
    }
    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-8px); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wave, .boat, .bird, .bud { animation: none; }
    }
  </style>
  <line class="line" x1="24" y1="29" x2="196" y2="29"/>
  <line class="line" x1="284" y1="29" x2="456" y2="29"/>
  <g class="bud">
    <path d="M 208 28 C 205.5 23 206.5 18.5 208.5 17 C 210.5 18.5 211.5 23 209 28 Z" fill="#dcaeae"/>
    <path d="M 208 28 C 205 26.5 203.5 23.5 204 21 C 206.5 22.5 208 25 208 28 Z" fill="#d9a8b4"/>
    <path d="M 209 28 C 212 26.5 213.5 23.5 213 21 C 210.5 22.5 209 25 209 28 Z" fill="#d9a8b4"/>
  </g>
  <path class="wave" d="M 218 34 Q 226 31 234 34 T 250 34 T 266 34"/>
  <g transform="translate(240, 30)">
    <g class="boat">
      <path d="M -14 0 C -7 2 7 2 14 0 C 10.5 5.5 -10.5 5.5 -14 0 Z" fill="#fbfcfc" stroke="#4a525c" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M -5 -1 C -3 -7 3 -7 5 -1" fill="none" stroke="#3f586a" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 7 -1 L 7 -12" stroke="#4a525c" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 7 -12 L 14.5 -9.5 L 7 -7 Z" fill="#d9a8b4"/>
    </g>
  </g>
  <g transform="translate(268, 22)">
    <path class="bird" d="M -5 0 Q -2.5 -3.5 0 -1 Q 2.5 -3.5 5 0" fill="none" stroke="#658092" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
