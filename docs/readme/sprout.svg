<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44" role="img" aria-label="藕花苞">
  <style>
    .bud { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 5s ease-in-out infinite; }
    @keyframes sway {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bud { animation: none; }
    }
  </style>
  <g transform="translate(22, 27)">
    <g class="bud">
      <path d="M 0 0 C -3 -7 -2 -13 0.5 -15 C 3 -13 4 -7 1 0 Z" fill="#dcaeae"/>
      <path d="M 0 0 C -4 -2 -6 -6 -5 -9 C -2 -7.5 0 -4 0 0 Z" fill="#d9a8b4"/>
      <path d="M 1 0 C 5 -2 7 -6 6 -9 C 3 -7.5 1 -4 1 0 Z" fill="#d9a8b4"/>
      <path d="M 0.5 0 C 0.5 5 0.5 10 0 15" stroke="#8ba394" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
